# Rendered by scripts/deploy-kind.sh (IMAGE placeholder) and re-created on
# every deploy — Jobs are immutable, so it is not part of kustomization.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: billing-migrate
  namespace: billing
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: IMAGE
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "migrate", "--force"]
          envFrom:
            - configMapRef: { name: billing-config }
            - secretRef: { name: billing-secret }
