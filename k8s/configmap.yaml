# Billing Service (Fase 4, namespace `billing`). Secret `billing-secret`
# (APP_KEY, DB_PASSWORD, RABBITMQ_*, PAYMENT_GATEWAY, MERCADOPAGO_ACCESS_TOKEN)
# vem de 15SOAT-Fase1-kubernetes/scripts/bootstrap-secrets.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
data:
  APP_NAME: "Billing Service"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://localhost:30080/billing"
  APP_LOCALE: "pt_BR"
  LOG_CHANNEL: "json"
  LOG_LEVEL: "info"
  DB_CONNECTION: "pgsql"
  DB_HOST: "billing-postgres"
  DB_PORT: "5432"
  DB_DATABASE: "billing"
  DB_USERNAME: "postgres"
  CACHE_STORE: "database"
  SESSION_DRIVER: "array"
  QUEUE_CONNECTION: "sync"
  RABBITMQ_HOST: "rabbitmq.platform.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_QUEUE: "billing.inbox"
  PAYMENT_GATEWAY: "offline"
  MERCADOPAGO_USE_SANDBOX_URL: "true"
  PUBLIC_BASE_URL: "http://localhost:30080"
  L5_SWAGGER_GENERATE_ALWAYS: "false"
  L5_SWAGGER_CONST_HOST: "http://localhost:30080"
  # APM local (ADR-016 no 15SOAT-Fase1): dd-trace envia spans no protocolo
  # Datadog para o OpenTelemetry Collector `trace-agent` (namespace platform),
  # que repassa ao Jaeger. DD_TRACE_AGENT_URL é obrigatório (o sidecar ignora
  # DD_AGENT_HOST).
  DD_SERVICE: "billing-service"
  DD_ENV: "dev"
  DD_VERSION: "4.0.0"
  DD_TRACE_ENABLED: "true"
  DD_TRACE_CLI_ENABLED: "false"
  DD_LOGS_INJECTION: "true"
  DD_AGENT_HOST: "trace-agent.platform.svc.cluster.local"
  DD_TRACE_AGENT_PORT: "8126"
  DD_TRACE_AGENT_URL: "http://trace-agent.platform.svc.cluster.local:8126"
  # A integração AMQP do dd-trace rotula seus spans como "amqp", e o receptor
  # datadog do Collector rotula o lote inteiro com o serviço do span raiz (no
  # consumidor, amqp.basic.deliver): sem este mapeamento todo o trabalho do
  # consumidor apareceria como "amqp". O broker segue visível nos spans
  # amqp.basic.publish/deliver (tags messaging.rabbitmq.*).
  DD_SERVICE_MAPPING: "amqp:billing-service"
