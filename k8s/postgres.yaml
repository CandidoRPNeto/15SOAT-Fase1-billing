# Banco próprio do Billing Service (PostgreSQL). Nenhum outro serviço o acessa.
apiVersion: v1
kind: Service
metadata:
  name: billing-postgres
spec:
  clusterIP: None
  selector:
    app: billing-postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: billing-postgres
spec:
  serviceName: billing-postgres
  replicas: 1
  selector:
    matchLabels:
      app: billing-postgres
  template:
    metadata:
      labels:
        app: billing-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: billing-config, key: DB_DATABASE } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: billing-config, key: DB_USERNAME } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: billing-secret, key: DB_PASSWORD } }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              # subPath evita o "lost+found" na raiz de um PVC recém-criado.
              subPath: postgres
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
