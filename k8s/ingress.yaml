# Rotas de negócio passam pelo ForwardAuth (ADR-013): o Traefik valida o token
# no OS Service e injeta X-User-*. O Swagger fica público em /billing/api/documentation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: billing-api
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: forward-auth@file
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/v1/budgets
            pathType: Prefix
            backend: { service: { name: billing-api, port: { number: 8000 } } }
          - path: /api/v1/payments
            pathType: Prefix
            backend: { service: { name: billing-api, port: { number: 8000 } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: billing-docs
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: strip-billing@file
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /billing
            pathType: Prefix
            backend: { service: { name: billing-api, port: { number: 8000 } } }
